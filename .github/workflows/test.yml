name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundled SheetJS matches the npm package
        run: cmp lib/xlsx.full.min.js node_modules/xlsx/dist/xlsx.full.min.js
      - run: npm test
